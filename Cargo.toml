[package]
name = "egress-resolver"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Resolve an attested list of hostnames over DNS-over-TLS and keep the Flashbox host firewall allowlist and container hosts file in sync"
repository = "https://github.com/flashbots/egress-resolver"

[dependencies]
hickory-net = { version = "0.26.3", default-features = false, features = ["tls-ring", "tokio"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
